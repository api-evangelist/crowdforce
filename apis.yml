name: CrowdForce
description: CrowdForce was a Nigerian fintech that operated the PayForce agent-banking
  network, deploying point-of-sale and digital financial-services agents to extend
  cash-in/cash-out, bill payments, and banking access to underbanked communities across
  Nigeria. Backed by 500 Global, its PayForce merchant/agent business merged with FairMoney's
  Fusion in 2023. As of this enrichment pass the crowdforce.io domain no longer serves an
  active product or developer surface. The homepage renders an empty Cloudflare-fronted
  shell and the /payforce path returns unrelated third-party (gambling) spam content, so
  no public API, developer portal, SDKs, or documentation could be verified.
